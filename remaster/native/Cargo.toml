[package]
name = "lt-native"
description = "Living Tool Remaster's native renderer: the captured scene drawn unlit through the game's own camera, and the gate that compares it with the emulated frame"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
emulator-core = { git = "https://github.com/pixalynx/PSoXide-emulator", rev = "b27fff97dc9b265d776fb031ca0c920c0f243f95" }
lt-emu-hooks = { path = "../../emu-host/hooks" }
lt-core = { path = "../../app/crates/lt-core" }
lt-scene = { path = "../scene" }
lt-assets = { path = "../assets" }
lt-testset = { path = "../testset" }
wgpu = "24"
bytemuck = "1"
pollster = "0.4"
png = "0.18"
lt-lockstep = { path = "../lockstep" }
# PSoXide's hardware renderer: its GP0 decoder (Translator) feeds the 2D layer.
psx-gpu-render = { git = "https://github.com/pixalynx/PSoXide-emulator", rev = "b27fff97dc9b265d776fb031ca0c920c0f243f95" }

[target.'cfg(target_os = "macos")'.dependencies]
# The bench's thread QoS (`check::interactive`), as the app's threads have it.
libc = "0.2"
