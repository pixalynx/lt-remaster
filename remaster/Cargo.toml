# Living Tool Remaster (research 16, epic LT-101): Guardian's Crusade's own code on the patched
# PSoXide core, with a native renderer growing over it. Its own workspace, like emu-host/: it links
# the GPL core in process, which the Living Tool app doesn't.
[workspace]
resolver = "2"
members = ["app", "testset", "lockstep", "scene", "assets", "native"]

[profile.release]
# The core is the hot path: a frame is ~3.5 ms optimised and several times that without.
opt-level = 3
# Drops the symbol tables and debug info, which nothing reads (no backtraces are printed): they
# were most of the Linux packages after lt-remaster shipped (0.1.25: .deb 16.8 → 53.8 MB). Like
# strip = true in app/Cargo.toml.
strip = true
