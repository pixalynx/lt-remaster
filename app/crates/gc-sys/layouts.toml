# The Guardian's Crusade memory that gc-sys names (LT-104). gen/gen.py turns this into
# src/generated.rs, checking every field against the decomp first.
#
# Each field (and each global's address) names its evidence:
#   from = "Type.field"  a struct field in the decomp (include/*.h or a typedef in src/). gen.py
#                        compiles a probe with the decomp's own matched compiler (GCC 2.7.2 CDK) and
#                        checks the offset and the size.
#   symbol = "name"      a decomp symbol. gen.py takes the address from config/symbol_addrs.txt or the
#                        link maps.
#   doc = "..."          written down elsewhere (Living Tool research, MAP_LOADING.md). Not
#                        measured; the live check (lt-emu example gc_sys_live) reads it from a running
#                        game.
#
# Types: u8 i8 u16 i16 u32 i32, matrix (MATRIX, 0x20), svector (SVECTOR, 8), vector (VECTOR, 0x10),
# and arrays as "u16[20]".

[struct.Ctx]
doc = "The scratchpad context: every task gets it (`MCTX` in the decomp, 0x1F800000)."
size = 0x400
fields = [
  { name = "ot", offset = 0x28, type = "u32", from = "Ctx_FUN_801821ac.ot", doc = "This frame's ordering table." },
  { name = "frame", offset = 0x42, type = "u8", from = "Ctx_FUN_801821ac.f42", doc = "Which of the two buffers is drawn into (0 or 1)." },
  { name = "mode", offset = 0x43, type = "u8", from = "Ctx_FUN_801821ac.f43", doc = "The game mode (2 = battle)." },
  { name = "wide", offset = 0x4C, type = "u8", from = "Ctx_FUN_801821ac.f4C", doc = "1 while the field draws at 512 x 224 (free roam), 0 at 320 x 224." },
  { name = "warp", offset = 0x50, type = "u16", doc = "A warp request: chunk | 0x8000 (Living Tool's lt_warp)." },
  { name = "view", offset = 0x98, type = "matrix", from = "Ctx_FUN_801821ac.m98", doc = "The camera's view matrix." },
  { name = "script", offset = 0xDE, type = "u16", from = "Ctx_FUN_801821ac.fDE", doc = "Script and field flags; bit 15 of the high byte (0xDF) is a transition loading or fading." },
  { name = "chunk", offset = 0xE8, type = "u16", doc = "The chunk the Knight is on (MAP_LOADING 1.3)." },
  { name = "play_time", offset = 0xEC, type = "u32", from = "MainCtx.fEC", doc = "Play time in vblanks." },
  { name = "object", offset = 0x11C, type = "matrix", from = "Ctx_FUN_801821ac.m11C", doc = "The object (world) matrix a draw composes with the view (Gte_SetComposedTransform)." },
]

[struct.Character]
doc = "One of the 87 character records (the decomp's CharStruct, `Character_Struct`)."
size = 0x38
fields = [
  { name = "x", offset = 0x0, type = "i16", from = "CharStruct.x" },
  { name = "h", offset = 0x2, type = "i16", from = "CharStruct.h", doc = "Height (Y down)." },
  { name = "z", offset = 0x4, type = "i16", from = "CharStruct.y" },
  { name = "talk", offset = 0x12, type = "u8", from = "CharStruct.f12", doc = "Talk state (Living Tool's CHARACTER_TALK)." },
  { name = "packets", offset = 0x18, type = "u32", from = "CharStruct.f18", doc = "The model's packet slot." },
  { name = "script", offset = 0x28, type = "u32", doc = "Its walk or scene program (Living Tool's CHARACTER_SCRIPT)." },
]

[struct.Part]
doc = "A model part as Model_DrawParts gets it (research 02: the built part record, 0x3C)."
size = 0x3C
fields = [
  { name = "counts", offset = 0x0, type = "u16[20]", doc = "Polygons per class, in the 20 build passes." },
  { name = "packets", offset = 0x28, type = "u32", doc = "Its GPU packets (two per polygon)." },
  { name = "vertices", offset = 0x2C, type = "u32", doc = "Its live vertices: this tick's pose, already morphed." },
  { name = "normals", offset = 0x30, type = "u32", doc = "Its normals (lit classes)." },
]

[struct.ChunkSlots]
doc = "The four field chunk slots: which chunk each holds and whether it's loaded."
size = 0xC
fields = [
  { name = "ids", offset = 0x0, type = "u16[4]", doc = "Chunk id per slot, 0xFFFF for none." },
  { name = "loaded", offset = 0x8, type = "u8[4]", doc = "1 when the slot's chunk is in RAM." },
]

[global.CTX]
addr = 0x1F800000
type = "Ctx"
doc = "The scratchpad context."

[global.CHARACTERS]
symbol = "Knight_Character_Struct"
type = "Character"
count = 87
doc = "The character records; 0 is the Knight, 1 the Baby."

[global.CHUNK_SLOTS]
symbol = "g_ChunkSlotIds_and_Loaded"
type = "ChunkSlots"
doc = "The chunk slot table."

[global.CHUNK_DATA]
addr = 0x80010000
stride = 0x2E000
count = 4
doc = "Slot n's chunk data (MAP_LOADING 1.2)."
