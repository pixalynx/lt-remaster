[package]
name = "lt-core"
description = "Guardian's Crusade disc, file-table and asset formats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.11"
crc32fast = "1"
sha1_smol = "1"
png = "0.18"
flate2 = "1"
encoding_rs = "0.8"
# Audio files in for streamed music (MP3, OGG Vorbis, FLAC, WAV, AIFF, M4A/AAC). MPL-2.0.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "aiff", "pcm"] }
