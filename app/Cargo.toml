[workspace]
resolver = "2"
members = ["src-tauri", "crates/lt-core", "crates/lt-emu", "crates/gc-sys"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.1.26"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
# Dependencies are optimised even in dev so disc scans stay fast.
opt-level = 2

[profile.release]
# Drops the symbol tables (9.4 MB of the Linux binary), which nothing reads:
# the app prints no backtraces.
strip = true
